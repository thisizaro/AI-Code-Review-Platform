spring.application.name=repomind-api
server.port=8080
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.default-property-inclusion=non_null

repomind.cors-origin=${CORS_ORIGIN:http://localhost:5173}
repomind.github.base-url=https://api.github.com
repomind.github.token=${GITHUB_TOKEN:}
repomind.github.timeout-seconds=30
repomind.github.max-zip-bytes=52428800
repomind.python.base-url=${PYTHON_SERVICE_URL:http://localhost:8000}
repomind.python.timeout-seconds=60
repomind.limits.max-files=300
repomind.limits.max-file-bytes=204800
repomind.limits.max-total-bytes=1572864
repomind.cache.ttl-minutes=30
repomind.max-body-bytes=65536
